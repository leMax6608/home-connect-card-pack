<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Home Connect Card Pack preview</title>
  <desc id="desc">Four dark Home Assistant-style appliance cards for a dishwasher, oven, coffee machine and dryer.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#151b2d"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#6eb8ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".34"/>
    </filter>
    <clipPath id="dishwasher-card-clip">
      <rect width="510" height="86" rx="22"/>
    </clipPath>
  </defs>
  <rect width="1200" height="630" rx="34" fill="url(#background)"/>
  <circle cx="1040" cy="20" r="260" fill="#4f8cff" opacity=".08"/>
  <circle cx="120" cy="610" r="230" fill="#6eb8ff" opacity=".05"/>
  <text x="74" y="82" fill="#f6f8ff" font-family="Inter,Segoe UI,sans-serif" font-size="34" font-weight="700">Home Connect Card Pack</text>
  <text x="76" y="116" fill="#98a3ba" font-family="Inter,Segoe UI,sans-serif" font-size="17">Unofficial Lovelace cards · compact, contextual and theme-aware</text>

  <g transform="translate(70 205)" filter="url(#shadow)">
    <g clip-path="url(#dishwasher-card-clip)">
      <image href="dishwasher-compact.png" x="-4.7" y="-3.8" width="514.6" height="95.8"/>
    </g>
  </g>

  <g transform="translate(620 160)" filter="url(#shadow)">
    <rect width="510" height="176" rx="24" fill="#202636" stroke="#344057"/>
    <rect width="510" height="4" rx="2" fill="#ff8f5b"/>
    <rect x="22" y="24" width="58" height="58" rx="17" fill="#161c2a" stroke="#704632"/>
    <path d="M40 39h22v27H40zM46 46h10M47 57h8" fill="none" stroke="#c9b0a5" stroke-width="3" stroke-linecap="round"/>
    <text x="98" y="50" fill="#f8f9fd" font-family="Inter,Segoe UI,sans-serif" font-size="20" font-weight="700">Oven</text>
    <circle cx="105" cy="73" r="4" fill="#ff9f72"/><text x="118" y="78" fill="#adb7c9" font-family="Inter,Segoe UI,sans-serif" font-size="15">Heating · Convection</text>
    <text x="389" y="58" fill="#ffb18b" font-family="Inter,Segoe UI,sans-serif" font-size="24" font-weight="700">180°</text>
    <rect x="22" y="108" width="466" height="10" rx="5" fill="#131a27"/><rect x="22" y="108" width="205" height="10" rx="5" fill="#ff8f5b"/>
    <text x="22" y="151" fill="#8e9ab0" font-family="Inter,Segoe UI,sans-serif" font-size="13">Target temperature</text><text x="454" y="151" text-anchor="end" fill="#d9deea" font-family="Inter,Segoe UI,sans-serif" font-size="13">200 °C</text>
  </g>

