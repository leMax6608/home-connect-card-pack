<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="990" viewBox="0 0 1200 990" role="img" aria-labelledby="title desc">
  <title id="title">Home Connect Card Pack preview</title>
  <desc id="desc">Four large Home Assistant-style appliance cards for a dishwasher, oven, coffee machine and dryer.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090e18"/>
      <stop offset="1" stop-color="#121827"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".42"/>
    </filter>
    <clipPath id="dishwasher-clip"><rect x="80" y="45" width="1040" height="190" rx="42"/></clipPath>
    <clipPath id="coffee-clip"><rect x="80" y="485" width="1040" height="222" rx="42"/></clipPath>
    <clipPath id="dryer-clip"><rect x="80" y="727" width="1040" height="218" rx="42"/></clipPath>
  </defs>

  <rect width="1200" height="990" rx="34" fill="url(#background)"/>
  <circle cx="1110" cy="80" r="280" fill="#4f8cff" opacity=".055"/>
  <circle cx="70" cy="930" r="250" fill="#9668ff" opacity=".045"/>

  <g filter="url(#shadow)">
    <image href="dishwasher-compact.png" x="80" y="45" width="1040" height="190" preserveAspectRatio="none" clip-path="url(#dishwasher-clip)"/>
  </g>

  <g transform="translate(80 255) scale(2.039215686)" filter="url(#shadow)">
    <rect width="510" height="103" rx="23" fill="#20232d" stroke="#3d3738"/>
    <rect width="510" height="3" rx="1.5" fill="#ff8f5b"/>
    <rect x="16" y="13" width="62" height="62" rx="18" fill="#28232a" stroke="#704632"/>
    <path d="M35 29h24v31H35zM40 35h14M41 48h12" fill="none" stroke="#d0b4aa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="94" y="39" fill="#f8f9fd" font-family="Inter,Segoe UI,sans-serif" font-size="20" font-weight="700">Backofen</text>
    <circle cx="101" cy="62" r="4" fill="#ff8f5b"/>
    <text x="113" y="67" fill="#adb7c9" font-family="Inter,Segoe UI,sans-serif" font-size="14">Im Betrieb · Heißluft</text>
    <rect x="363" y="22" width="68" height="34" rx="17" fill="#3b2e30"/>
    <text x="397" y="45" text-anchor="middle" fill="#ffad86" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="700">180°</text>
    <rect x="447" y="16" width="48" height="48" rx="24" fill="#1b1e27"/>
    <path d="M462 34l9 9 9-9" fill="none" stroke="#aeb4c2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="17" y="84" width="476" height="7" rx="3.5" fill="#151820"/>
    <rect x="17" y="84" width="210" height="7" rx="3.5" fill="#ff8f5b"/>
  </g>

  <g filter="url(#shadow)">
    <image href="coffee-machine-compact.png" x="80" y="485" width="1040" height="222" preserveAspectRatio="none" clip-path="url(#coffee-clip)"/>
    <image href="dryer-compact.png" x="80" y="727" width="1040" height="218" preserveAspectRatio="none" clip-path="url(#dryer-clip)"/>
  </g>
</svg>
