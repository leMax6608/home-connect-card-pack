    <circle cx="105" cy="73" r="4" fill="#b895ff"/><text x="118" y="78" fill="#adb7c9" font-family="Inter,Segoe UI,sans-serif" font-size="15">Ready · Espresso</text>
    <rect x="357" y="28" width="131" height="38" rx="19" fill="#34264f" stroke="#634b8b"/><text x="422" y="52" text-anchor="middle" fill="#d3bfff" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="700">Prepare</text>
    <rect x="22" y="108" width="143" height="45" rx="14" fill="#171d2b"/><text x="38" y="128" fill="#8792a7" font-family="Inter,Segoe UI,sans-serif" font-size="11">Amount</text><text x="38" y="146" fill="#e2e5ee" font-family="Inter,Segoe UI,sans-serif" font-size="14">40 ml</text>
    <rect x="176" y="108" width="143" height="45" rx="14" fill="#171d2b"/><text x="192" y="128" fill="#8792a7" font-family="Inter,Segoe UI,sans-serif" font-size="11">Strength</text><text x="192" y="146" fill="#e2e5ee" font-family="Inter,Segoe UI,sans-serif" font-size="14">Strong</text>
  </g>

  <g transform="translate(620 376)" filter="url(#shadow)">
    <rect width="510" height="176" rx="24" fill="#202636" stroke="#344057"/>
    <rect width="510" height="4" rx="2" fill="#34cda2"/>
    <rect x="22" y="24" width="58" height="58" rx="17" fill="#161c2a" stroke="#2c6d61"/>
    <circle cx="51" cy="53" r="15" fill="none" stroke="#9bcac0" stroke-width="3"/><path d="M51 43a10 10 0 018 6" fill="none" stroke="#9bcac0" stroke-width="3" stroke-linecap="round"/>
    <text x="98" y="50" fill="#f8f9fd" font-family="Inter,Segoe UI,sans-serif" font-size="20" font-weight="700">Dryer</text>
    <circle cx="105" cy="73" r="4" fill="#44d6af"/><text x="118" y="78" fill="#adb7c9" font-family="Inter,Segoe UI,sans-serif" font-size="15">Drying · Cotton</text>
    <rect x="356" y="30" width="52" height="30" rx="15" fill="#153f39"/><text x="370" y="50" fill="#62e1bf" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="700">38%</text>
    <rect x="418" y="30" width="70" height="30" rx="15" fill="#2c3344"/><text x="430" y="50" fill="#c0c8d6" font-family="Inter,Segoe UI,sans-serif" font-size="13">1:12 h</text>
    <rect x="22" y="108" width="466" height="10" rx="5" fill="#131a27"/><rect x="22" y="108" width="177" height="10" rx="5" fill="#34cda2"/>
    <text x="22" y="151" fill="#8e9ab0" font-family="Inter,Segoe UI,sans-serif" font-size="13">Gentle drying</text><text x="454" y="151" text-anchor="end" fill="#60dfbd" font-family="Inter,Segoe UI,sans-serif" font-size="13">On</text>
