    <rect width="510" height="176" rx="24" fill="#202636" stroke="#344057"/>
    <rect width="510" height="4" rx="2" fill="#b386ff"/>
    <rect x="22" y="24" width="58" height="58" rx="17" fill="#161c2a" stroke="#574477"/>
    <path d="M42 48h20v15a8 8 0 01-8 8h-4a8 8 0 01-8-8zm20 4h5a6 6 0 010 12h-4" fill="none" stroke="#bfb0d5" stroke-width="3" stroke-linecap="round"/>
