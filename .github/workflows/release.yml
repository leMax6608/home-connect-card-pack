name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Validate HACS dashboard repository
        uses: hacs/action@main
        with:
          category: plugin
  release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/home-connect-card-pack.js
          generate_release_notes: true
